controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0  # Hz
    action_monitor_rate: 20.0  # Hz
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.5
      joint1: { trajectory: 0.1, goal: 0.05 }
      joint2: { trajectory: 0.1, goal: 0.05 }
      joint3: { trajectory: 0.1, goal: 0.05 }
      joint4: { trajectory: 0.1, goal: 0.05 }
      joint5: { trajectory: 0.1, goal: 0.05 }
      joint6: { trajectory: 0.1, goal: 0.05 }

gazebo_ros2_control:
  ros__parameters:
    pid_gains:
      joint1: { p: 1200.0, i: 10.0, d: 50.0 }
      joint2: { p: 2500.0, i: 15.0, d: 100.0 }
      joint3: { p: 1500.0, i: 10.0, d: 60.0 }
      joint4: { p: 600.0,  i: 5.0,  d: 25.0 }
      joint5: { p: 400.0,  i: 2.0,  d: 15.0 }
      joint6: { p: 200.0,  i: 1.0,  d: 8.0 }
